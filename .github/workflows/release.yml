name: Build & Publish Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # allow manual runs

jobs:
  # ── Build wheels on all platforms ────────────────────────────────────────
  build:
    name: Build ${{ matrix.platform.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — uses manylinux Docker image for portable glibc
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64
            manylinux: auto

          # Linux AArch64 (ARM64 — e.g. AWS Graviton, Raspberry Pi 5)
          - os: ubuntu-latest
            platform: linux-aarch64
            target: aarch64
            manylinux: auto

          # macOS x86_64 (Intel)
          - os: macos-13
            platform: macos-x86_64
            target: x86_64-apple-darwin

          # macOS AArch64 (Apple Silicon)
          - os: macos-latest
            platform: macos-aarch64
            target: aarch64-apple-darwin

          # Windows x86_64
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Install all supported Python versions so maturin can build for each
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.13t
            3.14
            3.14t
          allow-prereleases: true

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # maturin-action installs maturin automatically

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist

  # ── Build source distribution ───────────────────────────────────────────
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # ── Test the built wheels ───────────────────────────────────────────────
  test:
    name: Test wheels (Linux x86_64)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-linux-*
          merge-multiple: true
          path: dist

      - name: Install wheel and test dependencies
        run: |
          pip install dist/thumbleweed-*cp312*manylinux*x86_64.whl
          pip install "Pillow>12" pytest

      - name: Run tests
        run: pytest -v

  # ── Publish to PyPI ─────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [build, sdist, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: List distributions
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses Trusted Publishing — configure on PyPI first:
        # https://docs.pypi.org/trusted-publishers/
