name: Build & Publish Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────────────────
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            platform: linux-i686
            target: i686
            manylinux: auto
          - os: ubuntu-latest
            platform: linux-aarch64
            target: aarch64
            manylinux: auto
          - os: ubuntu-latest
            platform: linux-armv7
            target: armv7
            manylinux: auto

          # ── macOS ──────────────────────────────────────────────────────────
          - os: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
          - os: macos-latest
            platform: macos-aarch64
            target: aarch64-apple-darwin

          # ── Windows ────────────────────────────────────────────────────────
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-latest
            platform: windows-i686
            target: i686-pc-windows-msvc
            arch: x86
          # NOTE: GitHub-hosted Windows runners do not provide ARM64 Python.
          # Enable only when self-hosted ARM64 runners or cargo-xwin cross-compilation is set up.
          # - os: windows-latest
          #   platform: windows-aarch64
          #   target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.13t
            3.14
            3.14t
          allow-prereleases: true
          architecture: ${{ matrix.arch || 'x64' }}

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.target != 'x86_64' && matrix.target != 'i686'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/${{ matrix.target == 'aarch64' && 'arm64' || matrix.target == 'armv7' && 'arm/v7' || matrix.target }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          maturin-version: v1.13.0

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: dist
          if-no-files-found: error
          compression-level: 0

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          maturin-version: v1.13.0

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist
          if-no-files-found: error
          compression-level: 0

  test:
    name: Test wheels
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            python-tag: "310"
          - python-version: "3.11"
            python-tag: "311"
          - python-version: "3.12"
            python-tag: "312"
          - python-version: "3.13"
            python-tag: "313"
          - python-version: "3.14"
            python-tag: "314"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-linux-x86_64
          merge-multiple: true
          path: dist

      - name: Create uv environment with test deps
        run: uv sync --group dev

      - name: Install built wheel into uv environment
        run: |
          uv pip install dist/thumbleweed-*cp${{ matrix.python-tag }}*manylinux*x86_64.whl

      - name: Run tests
        run: uv run pytest -v

  publish:
    name: Publish to PyPI
    needs: [build, sdist, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v6
        with:
          name: sdist
          path: dist

      - name: List distributions
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
