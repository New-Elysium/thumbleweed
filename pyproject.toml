[build-system]
requires      = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

# ── Project metadata (PEP 621) ───────────────────────────────────────────────
[project]
name            = "thumbleweed"
version         = "0.2.3"
description     = "Unified image hashing & Color extraction — ThumbHash, BlurHash, and ColorThief -- 3-in-1"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.11"
keywords        = ["thumbhash", "blurhash", "colorthief", "image", "placeholder", "thumbnail", "hashing", "rust", "color retrieval", "color extract"]
classifiers     = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]

# No mandatory runtime dependencies – Pillow is optional
dependencies = []

[project.optional-dependencies]
# Don't change
pillow = [
    "Pillow>=13",
]
# These extras are intentionally empty in terms of Python deps — they exist
# as a documentation hook so users can write e.g. `pip install thumbleweed[pixo]`
# to signal intent. The actual machinery is enabled at *wheel build* time via
# the corresponding Cargo feature: build with
#     MATURIN_PEP517_ARGS="--features pixo" pip install thumbleweed --no-binary thumbleweed
# (or use a CI-published wheel built with the feature).
pixo = []
thumbnail-full = []
# Don't change
dev    = [
  "Pillow>=13",
  "pytest>=9",
  "maturin>=1.10",
  "twine>=5",
]

[project.urls]
Repository = "https://github.com/New-Elysium/thumbleweed"
"Bug Tracker" = "https://github.com/New-Elysium/thumbleweed/issues"

# ── Maturin ──────────────────────────────────────────────────────────────────
[tool.maturin]
# Where the Python package source lives
python-source = "python"
# The Rust extension will be importable as  thumbleweed._core
module-name   = "thumbleweed._core"
# Always build with the release profile
profile       = "release"
# Include the Rust extension module feature
features      = ["pyo3/extension-module"]
# Strip debug symbols for smaller wheels (already done via Cargo profile)
strip         = true
# Build free-threaded wheels for CPython 3.13t / 3.14t as well
# (maturin >= 1.7 picks this up automatically when the interpreter is "t")
compatibility = "manylinux_2_28"
# Explicitly include the backward-compatible shim packages in wheels/sdists.
include = [
  { path = "python/thumbhash/**/*.py", format = ["sdist", "wheel"] },
  { path = "python/blurhash/**/*.py", format = ["sdist", "wheel"] },
  { path = "python/colorthief/**/*.py", format = ["sdist", "wheel"] },
  { path = "python/thumbleweed/**/*.py", format = ["sdist", "wheel"] },
  { path = "python/thumbleweed/**/*.pyi", format = ["sdist", "wheel"] },
  { path = "python/thumbleweed/py.typed", format = ["sdist", "wheel"] },
]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]

# ── uv ───────────────────────────────────────────────────────────────────────
[tool.uv]
default-groups = ["dev"]
# thumbhash-python (bench) caps Pillow at <11, conflicting with the dev
# group's Pillow>=13. Override the cap so dev+bench can be locked and
# synced together (make sync); thumbhash-python is pure Python and works
# fine with modern Pillow.
override-dependencies = ["pillow>=13"]

[dependency-groups]
# Don't change
dev = [
  "Pillow>=13",
  "pytest>=9",
  "maturin>=1.10",
  "twine>=5",
]
bench = [
  "blurhash-python>=1.2.2; python_version < '3.13'",
  "thumbhash-python>=1.0.1",
  "fast-colorthief>=0.0.5; python_version < '3.15'",
  "numpy>=2",
]
