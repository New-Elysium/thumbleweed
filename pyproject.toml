[build-system]
requires      = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

# ── Project metadata (PEP 621) ───────────────────────────────────────────────
[project]
name            = "thumbleweed"
version         = "0.1.4"
description     = "Unified image hashing — ThumbHash, BlurHash, and more — Rust-powered Python bindings"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"
keywords        = ["thumbhash", "blurhash", "colorthief", "image", "placeholder", "hashing", "rust"]
classifiers     = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]

# No mandatory runtime dependencies – Pillow is optional
dependencies = []

[project.optional-dependencies]
pillow = ["Pillow>11"]
dev    = [
  "Pillow>12",
  "pytest>=9",
  "maturin>=1.10",
  "twine>=5",
]
bench = [
  "blurhash>=1.1.5",
  "thumbhash>=0.1.2",
  "fast-colorthief>=0.0.5",
  "numpy>=2",
]

[project.urls]
Repository = "https://github.com/New-Elysium/thumbleweed"
"Bug Tracker" = "https://github.com/New-Elysium/thumbleweed/issues"

# ── Maturin ──────────────────────────────────────────────────────────────────
[tool.maturin]
# Where the Python package source lives
python-source = "python"
# The Rust extension will be importable as  thumbleweed._core
module-name   = "thumbleweed._core"
# Always build with the release profile
profile       = "release"
# Include the Rust extension module feature
features      = ["pyo3/extension-module"]
# Strip debug symbols for smaller wheels (already done via Cargo profile)
strip         = true
# Build free-threaded wheels for CPython 3.13t / 3.14t as well
# (maturin >= 1.7 picks this up automatically when the interpreter is "t")
compatibility = "manylinux2014"
# Explicitly include the backward-compatible shim packages in wheels/sdists.
include = [
  { path = "python/thumbhash/**/*.py", format = ["sdist", "wheel"] },
  { path = "python/blurhash/**/*.py", format = ["sdist", "wheel"] },
  { path = "python/colorthief/**/*.py", format = ["sdist", "wheel"] },
  { path = "python/thumbleweed/**/*.py", format = ["sdist", "wheel"] },
  { path = "python/thumbleweed/**/*.pyi", format = ["sdist", "wheel"] },
  { path = "python/thumbleweed/py.typed", format = ["sdist", "wheel"] },
]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]

# ── uv ───────────────────────────────────────────────────────────────────────
[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "Pillow>12",
  "pytest>=9",
  "maturin>=1.10",
  "twine>=5",
]
bench = [
  "blurhash>=1.1.5",
  "thumbhash>=0.1.2",
  "fast-colorthief>=0.0.5",
  "numpy>=2",
]
